name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "make env: .env con contrasenas aleatorias"
        run: |
          make env
          if grep -q 'change-me-please' .env; then
            echo "ERROR: .env conserva contrasenas por defecto"
            exit 1
          fi
          [ "$(stat -c '%a' .env)" = "600" ]
          # No puede machacar el .env: la db ya tiene la contraseña de la primera vez
          checksum="$(sha256sum .env)"
          make env
          [ "$(sha256sum .env)" = "${checksum}" ]

      - name: "make lint: compose, shellcheck, promtool y dashboard"
        run: make lint

      - name: "make up: construir y levantar el stack (espera a healthchecks)"
        run: make up

      - name: "make health: endpoints de salud a traves del proxy"
        run: make health

      - name: Validar configuracion de Nginx en ejecucion
        run: docker compose exec -T proxy nginx -t

      - name: Comprobar /healthz del proxy
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
            http://localhost:8080/healthz | grep -qx "ok"

      - name: Comprobar /health de la app (incluye la base de datos)
        run: |
          curl --fail --silent --show-error http://localhost:8080/health | tee /dev/stderr \
            | grep -q '"database":"ok"'

      - name: Comprobar que las visitas se guardan en PostgreSQL
        run: |
          count() {
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM visits"'
          }
          before="$(count)"
          curl --fail --silent --show-error http://localhost:8080/ | grep -q "infra-lab funciona"
          curl --fail --silent --show-error http://localhost:8080/ > /dev/null
          after="$(count)"
          echo "visitas: ${before} -> ${after}"
          [ "${after}" -eq "$((before + 2))" ]
          echo "${after}" > /tmp/visits_before_restart

      - name: "Comprobar que los datos sobreviven a un reinicio (make restart)"
        run: |
          make restart
          after="$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM visits"')"
          echo "visitas tras reinicio: ${after}"
          [ "${after}" -eq "$(cat /tmp/visits_before_restart)" ]

      - name: "Backup: crear, verificar checksums y rotar (conservar 3)"
        run: |
          for _ in 1 2 3 4 5; do
            make backup KEEP=3
            sleep 1.1
          done
          ls -la backups
          [ "$(find backups -maxdepth 1 -name 'infralab_*.dump' | wc -l)" -eq 3 ]
          [ "$(find backups -maxdepth 1 -name 'infralab_*.dump.sha256' | wc -l)" -eq 3 ]
          [ -z "$(find backups -maxdepth 1 -name '*.partial')" ]
          (cd backups && sha256sum --check ./*.sha256)

      - name: "Backup: no se ejecutan dos a la vez"
        run: |
          mkdir backups/.backup.lock
          if ./scripts/backup.sh -k 3; then
            echo "ERROR: el backup deberia fallar con el lock tomado"
            exit 1
          fi
          # El backup que falla no puede borrar el lock del otro
          rmdir backups/.backup.lock

      - name: "Restore: recuperar los datos del ultimo backup"
        run: |
          count() {
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM visits"'
          }
          make backup KEEP=3
          expected="$(count)"
          for _ in 1 2 3; do curl --fail --silent http://localhost:8080/ > /dev/null; done
          [ "$(count)" -eq "$((expected + 3))" ]
          make restore FILE=latest YES=1
          restored="$(count)"
          echo "visitas: backup=${expected} restaurado=${restored}"
          [ "${restored}" -eq "${expected}" ]
          curl --fail --silent --show-error http://localhost:8080/health

      - name: "Restore: rechaza un backup danado"
        run: |
          latest="$(find backups -maxdepth 1 -name 'infralab_*.dump' | sort | tail -n 1)"
          printf 'x' >> "${latest}"
          if ./scripts/restore.sh -y latest; then
            echo "ERROR: el restore deberia fallar con un checksum incorrecto"
            exit 1
          fi

      - name: Comprobar que /metrics no es accesible desde fuera
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/metrics)"
          echo "GET /metrics -> ${code}"
          [ "${code}" = "404" ]

      - name: "Prometheus: todos los targets en estado up"
        run: |
          for _ in $(seq 1 24); do
            status="$(docker compose exec -T prometheus wget -qO- 'http://127.0.0.1:9090/api/v1/targets?state=active' \
              | jq -r '.data.activeTargets[] | "\(.labels.job)=\(.health)"' | sort)"
            echo "${status}" && echo "---"
            if [ "$(echo "${status}" | grep -c '=up$')" -eq 4 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "ERROR: no todos los targets estan up"
          exit 1

      - name: "Prometheus: metricas de app, Nginx y PostgreSQL"
        run: |
          prom_query() {
            docker compose exec -T prometheus wget -qO- --post-data "query=$1" http://127.0.0.1:9090/api/v1/query
          }
          for q in 'sum(infralab_http_requests_total) > 0' 'nginx_up == 1' 'pg_up == 1'; do
            for _ in $(seq 1 12); do
              if prom_query "${q}" | jq -e '.data.result | length > 0' > /dev/null; then
                echo "OK: ${q}"
                continue 2
              fi
              sleep 5
            done
            echo "ERROR: la consulta '${q}' no devuelve resultados"
            exit 1
          done

      - name: "Grafana: salud, datasource y dashboard a traves del proxy"
        run: |
          set -a && . ./.env && set +a
          auth="${GRAFANA_ADMIN_USER}:${GRAFANA_ADMIN_PASSWORD}"
          base="http://localhost:8080/grafana"
          curl --fail --silent --show-error "${base}/api/health" | jq -e '.database == "ok"'
          curl --fail --silent --show-error -u "${auth}" "${base}/api/datasources/uid/prometheus/health" \
            | jq -e '.status == "OK"'
          curl --fail --silent --show-error -u "${auth}" "${base}/api/dashboards/uid/infra-lab-overview" \
            | jq -e '.dashboard.title'

      - name: "Grafana: la interfaz carga todos sus ficheros a traves del proxy"
        run: |
          html="$(curl --fail --silent --show-error http://localhost:8080/grafana/login)"
          echo "${html}" | grep -q '<base href="/grafana/"'
          assets="$(echo "${html}" | grep -oE '(src|href)="public/build/[^"]+\.(js|css)"' | cut -d'"' -f2)"
          [ -n "${assets}" ]
          failed=0
          for asset in ${assets}; do
            result="$(curl --silent --output /dev/null --write-out '%{http_code} %{content_type}' \
              "http://localhost:8080/grafana/${asset}")"
            echo "${asset} -> ${result}"
            case "${result}" in
              "200 text/javascript"*|"200 text/css"*) ;;
              *) failed=1 ;;
            esac
          done
          [ "${failed}" -eq 0 ]

      - name: Comprobar aislamiento de red
        run: |
          set -x
          [ "$(docker network inspect infra-lab-backend --format '{{.Internal}}')" = "true" ]
          [ "$(docker network inspect infra-lab-monitoring --format '{{.Internal}}')" = "true" ]
          docker compose exec -T proxy getent hosts web
          docker compose exec -T proxy getent hosts grafana
          # Si alguien se hace con el proxy, no puede llegar a la db ni a Prometheus
          for host in db prometheus; do
            if docker compose exec -T proxy getent hosts "${host}"; then
              echo "ERROR: el proxy puede resolver ${host}"
              exit 1
            fi
          done

      - name: Comprobar que solo el proxy publica puertos
        run: |
          for c in $(docker compose ps --format '{{.Name}}'); do
            [ "${c}" = "infra-lab-proxy" ] && continue
            bindings="$(docker inspect "${c}" --format '{{json .HostConfig.PortBindings}}')"
            echo "${c}: ${bindings}"
            [ "${bindings}" = "{}" ] || [ "${bindings}" = "null" ]
          done

      - name: Logs de los contenedores (si algo falla)
        if: failure()
        run: docker compose logs --no-color

      - name: Parar el stack
        if: always()
        run: docker compose down --volumes
