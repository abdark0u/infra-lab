name: Security

# Escaneo de seguridad con Trivy (scripts/security-scan.sh).
# Se lanza en cada push y además todos los lunes, porque salen CVE nuevas cada
# semana aunque yo no toque el código.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (imagen, Dockerfile, secretos y terceros)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Escaneo de seguridad (make scan)
        run: make scan
