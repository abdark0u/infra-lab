name: Screenshots

# A mano (gh workflow run screenshots.yml): capturas reales para el README
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.54.1"

jobs:
  screenshots:
    name: Capturas de la web y de Grafana
    # Playwright 1.54 no funciona en ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Crear .env
        run: make env

      - name: Permitir lectura anonima de Grafana (solo en este job)
        run: |
          cat > "${RUNNER_TEMP}/grafana-anonymous.yml" <<'EOF'
          services:
            grafana:
              environment:
                GF_AUTH_ANONYMOUS_ENABLED: "true"
                GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
          EOF

      - name: Levantar el stack
        run: |
          docker compose -f docker-compose.yml -f "${RUNNER_TEMP}/grafana-anonymous.yml" \
            up -d --build --wait --wait-timeout 180

      - name: Generar trafico durante 150 segundos
        run: |
          end=$((SECONDS + 150))
          while [ "${SECONDS}" -lt "${end}" ]; do
            curl --silent --output /dev/null http://localhost:8080/
            curl --silent --output /dev/null http://localhost:8080/health
            if [ $((RANDOM % 6)) -eq 0 ]; then
              curl --silent --output /dev/null http://localhost:8080/no-existe
            fi
            sleep "0.$((RANDOM % 8 + 2))"
          done
          # Último scrape de Prometheus
          sleep 20

      - name: Instalar Playwright y Chromium
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p playwright && cd playwright
          npm init -y > /dev/null
          npm install --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Hacer las capturas (espera a que las graficas esten dibujadas)
        run: |
          cp .github/scripts/capture-screenshots.mjs "${RUNNER_TEMP}/playwright/"
          OUT_DIR="${GITHUB_WORKSPACE}/screenshots" node "${RUNNER_TEMP}/playwright/capture-screenshots.mjs"

      - name: Subir capturas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Logs de los contenedores (si algo falla)
        if: failure()
        run: docker compose logs --no-color

      - name: Parar el stack
        if: always()
        run: docker compose down --volumes
