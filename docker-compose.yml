name: infra-lab

services:
  # Proxy inverso: unico servicio con puerto publicado
  proxy:
    image: nginx:1.27-alpine
    container_name: infra-lab-proxy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - frontend
    restart: unless-stopped

  # App web (Python + Flask): la ve el proxy por "frontend" y habla con la db por "backend"
  web:
    build: ./web
    image: infra-lab-web:local
    container_name: infra-lab-web
    environment:
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-infralab}
      DB_USER: ${POSTGRES_USER:-infralab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
      - backend
    restart: unless-stopped

  # Base de datos: solo en la red interna, sin puertos publicados
  db:
    image: postgres:17-alpine
    container_name: infra-lab-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infralab}
      POSTGRES_USER: ${POSTGRES_USER:-infralab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
    name: infra-lab-frontend
  # internal: true -> sin salida a Internet y sin acceso desde el host
  backend:
    name: infra-lab-backend
    internal: true

volumes:
  db-data:
    name: infra-lab-db-data
