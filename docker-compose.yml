name: infra-lab

services:
  # Proxy inverso: unico servicio expuesto al exterior
  proxy:
    image: nginx:1.27-alpine
    container_name: infra-lab-proxy
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - frontend
    restart: unless-stopped

  # Web sencilla (estatica por ahora); no publica puertos, solo la ve el proxy
  web:
    image: nginx:1.27-alpine
    container_name: infra-lab-web
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    name: infra-lab-frontend
