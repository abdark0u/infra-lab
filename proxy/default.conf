upstream web_backend {
    server web:8000;
}

upstream grafana_backend {
    server grafana:3000;
}

# Para los websockets de Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # No enseño la versión de Nginx: información gratis para un atacante
    server_tokens off;

    # $http_host conserva el puerto: Grafana lo compara con el Origin contra CSRF
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web_backend;
    }

    # Las métricas no son públicas: Prometheus las lee por la red interna
    location = /metrics {
        return 404;
    }

    location /grafana/ {
        proxy_pass http://grafana_backend;
    }

    location /grafana/api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_pass http://grafana_backend;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Para nginx-exporter. El 8081 no se publica: solo se llega desde la red frontend
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
