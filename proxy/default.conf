# Nginx como proxy inverso. Docker resuelve "web" y "grafana" por nombre
# dentro de la red "frontend".

upstream web_backend {
    server web:8000;
}

upstream grafana_backend {
    server grafana:3000;
}

# Necesario para los websockets de Grafana Live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # No revelar la version de Nginx
    server_tokens off;

    # $http_host conserva el puerto (localhost:8080); Grafana lo compara con
    # el Origin del navegador para proteger contra CSRF.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://web_backend;
    }

    # Las metricas de la app solo las lee Prometheus por la red interna
    location = /metrics {
        return 404;
    }

    location /grafana/ {
        proxy_pass http://grafana_backend;
    }

    location /grafana/api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $http_host;
        proxy_pass http://grafana_backend;
    }

    # Comprobacion de salud del propio proxy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Estadisticas internas de Nginx para nginx-exporter.
# El puerto 8081 no se publica: solo es accesible dentro de la red "frontend".
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
