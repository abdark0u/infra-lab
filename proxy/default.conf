# Nginx como proxy inverso hacia el servicio "web".
# Docker resuelve "web" por nombre dentro de la red "frontend".

upstream web_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # No revelar la version de Nginx
    server_tokens off;

    location / {
        proxy_pass         http://web_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Comprobacion de salud del propio proxy
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
